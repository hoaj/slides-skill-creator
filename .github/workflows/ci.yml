# One version across engine/VERSION and the manifests, raised when shipped files change; valid
# manifests; the tests on the Engine's oldest and a current Python; and reproducible release assets.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: One version, raised when shipped files change
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 scripts/release.py check-version --base "origin/$BASE_REF"
          else
            python3 scripts/release.py check-version
          fi
      - name: Validate the plugin and the Cursor marketplace
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.332 plugin validate --strict .
          npx --yes @anthropic-ai/claude-code@2.1.332 plugin validate --strict .cursor-plugin/marketplace.json

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests
        run: python -m unittest discover -s tests -t .

  release-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the release assets twice and compare
        run: |
          python3 scripts/release.py build --out "$RUNNER_TEMP/first"
          python3 scripts/release.py build --out "$RUNNER_TEMP/second"
          diff -r "$RUNNER_TEMP/first" "$RUNNER_TEMP/second"
          cd "$RUNNER_TEMP/first" && sha256sum -c SHA256SUMS

  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Lint the workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
