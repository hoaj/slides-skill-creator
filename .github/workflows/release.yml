# A merge to main whose version has no tag yet publishes it as an immutable release vX.Y.Z with
# slides-skill-X.Y.Z.tar.gz, release-manifest.json and SHA256SUMS, attested by this workflow.
# A -dev version is never released. Immutable releases must be on before the first release.
name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Decide whether this version is released
        id: plan
        run: |
          python3 scripts/release.py check-version
          python3 scripts/release.py plan | tee -a "$GITHUB_OUTPUT"
      - name: Build the release assets
        if: steps.plan.outputs.release == 'true'
        run: python3 scripts/release.py build --out dist
      - name: Attest the build
        if: steps.plan.outputs.release == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/slides-skill-${{ steps.plan.outputs.version }}.tar.gz
            dist/release-manifest.json
            dist/SHA256SUMS
      - name: Publish the release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          args=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes)
          if [ -n "$PREVIOUS" ]; then args+=(--notes-start-tag "$PREVIOUS"); fi
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$TAG" dist/* "${args[@]}"
      - name: Verify the published release as Upgrade will
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          gh release verify "$TAG"
          for asset in dist/*; do
            gh release verify-asset "$TAG" "$asset"
            gh attestation verify "$asset" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml"
          done
