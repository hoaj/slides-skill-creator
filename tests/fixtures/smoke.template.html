<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

/*__CHROME__*/
.deck-icon { width:64px; height:64px; display:inline-block; fill:currentColor; }
</style>
</head>
<body>
  <div class="deck-viewport">
    <main class="deck-stage" id="deckStage" data-deck-id="smoke-1" data-deck-rev="r1" data-date="2026-01-15"
          data-theme="white" data-header="Neutral header" lang="en">
      <div class="deck-frame">
        <span class="deck-logo"><!--__LOGO__--></span>
        <span class="deck-date"></span>
        <span class="deck-pagenum"></span>
        <span class="deck-classification"></span>
        <span class="deck-header"></span>
      </div>
      <section class="slide" data-theme="white" data-title="Opening">
        <div class="slide-content center">
          <h1 id="headline" style="font:700 var(--fs-hero)/1 var(--font-display)">Neutral opening</h1>
          <p style="font-size:var(--fs-h3);color:var(--muted)">A plain subtitle</p>
        </div>
      </section>
      <section class="slide" data-theme="silver" data-title="Steps">
        <div class="slide-content center">
          <h2 style="font:700 var(--fs-h1)/1 var(--font-display)">Progress in order</h2>
          <p id="step-one" data-step style="font-size:var(--fs-body)">First point</p>
          <p id="step-two" data-step style="font-size:var(--fs-body)">Second point</p>
        </div>
      </section>
      <section class="slide" data-theme="graphite" data-title="Widgets">
        <div class="slide-content center">
          <h2 style="font:700 var(--fs-h1)/1 var(--font-display)">
            <svg id="icon" class="deck-icon" viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="1" width="8" height="8"/></svg>
            Measures</h2>
          <span class="counter-stat" data-to="42" data-suffix="%">0</span>
          <div class="chart-bars" style="height:280px">
            <div class="bar" data-value="40" data-max="100" style="--bar-color:var(--series-1)">
              <span class="value">40</span><div class="fill"></div><span class="label">Before</span></div>
            <div class="bar" data-value="80" data-max="100" style="--bar-color:var(--series-2)">
              <span class="value">80</span><div class="fill"></div><span class="label">After</span></div>
          </div>
        </div>
      </section>
    </main>
  </div>

</html>
